# Mode: full — NestJS storage backend over Redis. The original stack.
services:
  excalidraw:
    environment:
      - VITE_APP_HTTP_STORAGE_BACKEND_URL=http://storage:8080/api/v2
    depends_on:
      - storage

  storage:
    build:
      context: ./excalidraw-storage-backend
    container_name: excalidraw-storage
    restart: unless-stopped
    environment:
      - PORT=8080
      - STORAGE_URI=redis://redis:6379
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: excalidraw-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  redis-data:
