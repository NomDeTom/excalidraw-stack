# Mode: full (legacy) -- NestJS storage backend over Redis. The original stack; kept
# while hub mode is proven, see notes-sync/irate-box/plans/offline-storage-plan.md.
services:
  excalidraw:
    volumes:
      - ./nginx/stack-full.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - storage

  storage:
    build:
      context: ./excalidraw-storage-backend
    container_name: excalidraw-storage
    restart: unless-stopped
    environment:
      - PORT=8080
      - STORAGE_URI=redis://redis:6379
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: excalidraw-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  redis-data:
