# Mode: sqlite (legacy) -- NestJS storage backend over a SQLite file, no Redis.
# Untested as of 2026-09-21: whether sqlite3@5.0.3 has a prebuilt binary for the
# image's Node on ARMv7 is an open item in notes-sync/excalidraw-stack/todo.md.
services:
  excalidraw:
    volumes:
      - ./nginx/stack-full.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - storage

  storage:
    build:
      context: ./excalidraw-storage-backend
    container_name: excalidraw-storage
    restart: unless-stopped
    environment:
      - PORT=8080
      - STORAGE_URI=sqlite:///data/excalidraw.sqlite
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sqlite-data:
