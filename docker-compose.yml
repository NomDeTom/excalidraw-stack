# Base: the frontend and the live-collab relay. Pick a storage mode with one overlay:
#   compose.full.yml    NestJS storage + Redis            (the original stack)
#   compose.sqlite.yml  NestJS storage over a SQLite file (no Redis)
#   compose.hub.yml     no storage service — the Irate-Box hub's store.py serves /api/v2
# ./excalidraw.sh --mode <full|sqlite|hub> start   (or set STACK_MODE)
#
# VITE_APP_* values are injected at container start by launcher.py (the image rewrites
# import.meta.env to window._env_), so changing mode never needs a rebuild.
services:
  excalidraw:
    build:
      context: ./excalidraw
      dockerfile: Dockerfile.standalone
    container_name: excalidraw
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - VITE_APP_STORAGE_BACKEND=http
      - VITE_APP_WS_SERVER_URL=http://room:80
      - VITE_APP_FIREBASE_CONFIG={}
      - VITE_APP_BACKEND_V2_GET_URL=
      - VITE_APP_BACKEND_V2_POST_URL=
      - VITE_APP_ENABLE_TRACKING=false
    depends_on:
      - room
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

  room:
    build:
      context: ./excalidraw-room
    container_name: excalidraw-room
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
