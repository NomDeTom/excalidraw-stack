# Base: the frontend and the live-collab relay. Pick a storage mode with one overlay:
#   compose.hub.yml     no storage service -- the Irate-Box hub's store.py serves /api/v2 (default)
#   compose.full.yml    legacy: NestJS storage + Redis
#   compose.sqlite.yml  legacy: NestJS storage over a SQLite file
# ./excalidraw.sh --mode <hub|full|sqlite> start   (or set STACK_MODE)
#
# The browser only ever talks to http://localhost:3000. nginx in the excalidraw container
# proxies /api/v2/ (storage) and /socket.io/ (room) -- see nginx/ -- so no Docker-internal
# hostname reaches the browser. VITE_APP_* values are injected at container start by
# launcher.py, so changing mode never needs a rebuild.
services:
  excalidraw:
    build:
      context: ./excalidraw
      dockerfile: Dockerfile.standalone
    container_name: excalidraw
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - VITE_APP_STORAGE_BACKEND=http
      - VITE_APP_HTTP_STORAGE_BACKEND_URL=/api/v2
      - VITE_APP_BACKEND_V2_GET_URL=/api/v2/scenes/
      - VITE_APP_BACKEND_V2_POST_URL=/api/v2/scenes/
      # Empty: socket.io connects to this page's own origin, i.e. /socket.io/ on nginx.
      - VITE_APP_WS_SERVER_URL=
      - VITE_APP_FIREBASE_CONFIG={}
      - VITE_APP_ENABLE_TRACKING=false
    depends_on:
      - room
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

  room:
    build:
      context: ./excalidraw-room
    container_name: excalidraw-room
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
