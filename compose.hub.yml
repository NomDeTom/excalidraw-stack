# Mode: hub (default) -- no storage service at all. Scenes, rooms and pasted files go to
# the Irate-Box hub's store.py, which reimplements the /api/v2 contract over a directory.
# Run the hub on the Docker host first: `python3 server.py` in ~/irate-box (port 8000).
services:
  excalidraw:
    volumes:
      - ./nginx/stack-hub.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
