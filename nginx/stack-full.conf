# Mounted over the image's default.conf in the full and sqlite modes. Everything the
# browser needs is on this one origin, so no Docker-internal hostname ever reaches it.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Scenes, collaboration rooms and pasted images: the NestJS storage backend.
    location /api/v2/ {
        proxy_pass http://storage:8080;
        client_max_body_size 50m;
    }

    # Live collaboration: the socket.io relay, WebSocket upgrade included.
    location /socket.io/ {
        proxy_pass http://room:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
